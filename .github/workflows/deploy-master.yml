name: Verify master release

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: verify-master-release
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/consensus_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: consensus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consensus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile

      - name: Verify release gates
        run: pnpm run verify:release

      - name: Validate Docker runtime image
        run: |
          docker build --target runtime --build-context application_source=. --build-arg RELEASE_CANDIDATE_SHA=${{ github.sha }} --build-arg REVIEWED_TOOLING_HEAD=${{ github.sha }} -t consensus-runtime-check:${{ github.sha }} .
          docker run --rm "consensus-runtime-check:${{ github.sha }}" node -e "const fs=require('node:fs'); const forbidden=['/app/packages/db-migrator','/app/artifacts','/app/.superpowers','/app/.worktrees']; if(forbidden.some(fs.existsSync)||!fs.existsSync('/app/.consensus-application-inputs.json')) process.exit(1); const marker=require('/app/.consensus-application-inputs.json'); if(!/^[a-f0-9]{64}$/.test(marker.manifestSha256)) process.exit(1); try { require.resolve('better-sqlite3'); process.exit(1) } catch { process.exit(0) }"
