name: consensus-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consensus_local_v2
      POSTGRES_USER: consensus_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - consensus-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus_dev -d consensus_local_v2"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  consensus-postgres-dev-data:
