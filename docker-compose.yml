# CONSENSUS Docker Compose
# Usage:
#   docker compose up -d --build
#   docker compose logs -f app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consensus-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Only accessible locally; Nginx handles external traffic
    volumes:
      - consensus-resources:/app/packages/server/resources # Uploaded images and generated audio
      - ./avatars:/app/avatars          # Avatar images
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/toc/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: consensus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  consensus-resources:
    driver: local
