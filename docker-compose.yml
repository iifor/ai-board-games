# CONSENSUS Docker Compose
# Production application and traffic are profile-gated; use only the reviewed
# scripts/ops/postgres entrypoints from the first-deployment runbook.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: consensus
      POSTGRES_USER: consensus_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_MIGRATOR_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    entrypoint:
      - /bin/sh
      - /usr/local/bin/start-production-postgres.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres-tls/server.crt
      - -c
      - ssl_key_file=/run/postgres-tls/server.key
      - -c
      - ssl_ca_file=/run/postgres-tls/ca.crt
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - consensus-postgres-data:/var/lib/postgresql/data
      - ./scripts/ops/postgres/init-production-roles.sh:/docker-entrypoint-initdb.d/10-init-production-roles.sh:ro
      - ./scripts/ops/postgres/start-production-postgres.sh:/usr/local/bin/start-production-postgres.sh:ro
      - ${POSTGRES_TLS_SOURCE_DIR:-../consensus-secrets/postgres-tls}:/run/postgres-tls-source:ro
    tmpfs:
      - /run/postgres-tls:rw,noexec,nosuid,nodev,size=1m,mode=0755
    secrets:
      - postgres_bootstrap_password
      - postgres_app_password
      - postgres_migrator_password
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /run/secrets/postgres_app_password) PGSSLMODE=verify-full PGSSLROOTCERT=/run/postgres-tls/ca.crt psql -h postgres -U consensus_app -d consensus -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    profiles: [application]
    image: consensus-production-app
    build:
      context: .
      additional_contexts:
        application_source: ${APPLICATION_SOURCE_ROOT:-.}
      dockerfile: Dockerfile
      target: runtime
      args:
        RELEASE_CANDIDATE_SHA: ${RELEASE_CANDIDATE_SHA:-unbound}
        REVIEWED_TOOLING_HEAD: ${REVIEWED_TOOLING_HEAD:-unbound}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Only accessible locally; Nginx handles external traffic
    volumes:
      - consensus-resources:/app/packages/server/resources # Uploaded images and generated audio
      - ./avatars:/app/avatars          # Avatar images
    secrets:
      - postgres_app_password
      - postgres_ca
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_SSL=verify-full
      - DATABASE_SCHEMA=consensus
      - DATABASE_POOL_MAX=10
      - DATABASE_CONNECTION_TIMEOUT_MS=5000
      - DATABASE_STATEMENT_TIMEOUT_MS=30000
      - DATABASE_CA_PATH=/run/secrets/postgres_ca
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/toc/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    profiles: [traffic]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  migrator:
    image: consensus-production-migrator
    build:
      context: .
      additional_contexts:
        application_source: ${APPLICATION_SOURCE_ROOT:-.}
      dockerfile: Dockerfile
      target: ops
      args:
        RELEASE_CANDIDATE_SHA: ${RELEASE_CANDIDATE_SHA:-unbound}
        REVIEWED_TOOLING_HEAD: ${REVIEWED_TOOLING_HEAD:-unbound}
    profiles: [ops]
    environment:
      DATABASE_SSL: verify-full
      DATABASE_SCHEMA: consensus
      DATABASE_CA_PATH: /run/secrets/postgres_ca
    secrets:
      - postgres_migrator_password
      - postgres_ca
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_bootstrap_password:
    file: ${POSTGRES_BOOTSTRAP_PASSWORD_FILE:-../consensus-secrets/postgres-bootstrap-password}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:-../consensus-secrets/postgres-app-password}
  postgres_migrator_password:
    file: ${POSTGRES_MIGRATOR_PASSWORD_FILE:-../consensus-secrets/postgres-migrator-password}
  postgres_ca:
    file: ${POSTGRES_CA_FILE:-../consensus-secrets/postgres-ca/ca.crt}

volumes:
  consensus-resources:
    driver: local
  consensus-postgres-data:
    driver: local
