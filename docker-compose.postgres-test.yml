services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consensus_test
      POSTGRES_USER: consensus_test
      POSTGRES_PASSWORD: consensus_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus_test -d consensus_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
